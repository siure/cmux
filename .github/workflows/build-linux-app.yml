name: Build Linux Desktop App

on:
  workflow_dispatch:
    inputs:
      cmux_ref:
        description: Optional cmux commit to build instead of the dispatched ref
        required: false
        type: string
      ghostty_ref:
        description: Published 40-character manaflow-ai/ghostty commit to embed
        required: true
        type: string
      bundle_version:
        description: Optional version written into the bundle metadata
        required: false
        type: string
  workflow_call:
    inputs:
      cmux_ref:
        description: Optional cmux commit to build instead of the caller commit
        required: false
        type: string
      ghostty_ref:
        description: Published 40-character manaflow-ai/ghostty commit to embed
        required: true
        type: string
      bundle_version:
        description: Optional version written into the bundle metadata
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linux-desktop-app-${{ github.ref }}-${{ inputs.ghostty_ref }}
  cancel-in-progress: false

jobs:
  build-linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_VERSION: "1.92.0"
      ZIG_VERSION: "0.15.2"
      ZIG_SHA256: "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239"

    steps:
      - name: Checkout cmux
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.cmux_ref || github.sha }}
          fetch-depth: 0

      - name: Validate immutable Linux Ghostty revision
        env:
          GHOSTTY_REF: ${{ inputs.ghostty_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$GHOSTTY_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ghostty_ref must be an immutable 40-character Git commit SHA" >&2
            exit 1
          fi

      - name: Checkout Linux Ghostty revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: manaflow-ai/ghostty
          ref: ${{ inputs.ghostty_ref }}
          path: ghostty-linux
          fetch-depth: 1

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc \
            g++ \
            libegl1-mesa-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            mesa-utils \
            pkg-config \
            xz-utils

      - name: Configure Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Install pinned Zig
        run: |
          archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          url="https://ziglang.org/download/${ZIG_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "/tmp/$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "/tmp/$archive" | sha256sum --check -
          sudo tar -xJf "/tmp/$archive" -C /opt
          sudo ln -sf "/opt/zig-x86_64-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version

      - name: Cache Rust and Zig build data
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            linux/target
            ~/.cache/zig
            ghostty-linux/.zig-cache
          key: linux-desktop-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ env.ZIG_VERSION }}-${{ hashFiles('linux/Cargo.lock') }}-${{ inputs.ghostty_ref }}

      - name: Build validated Linux desktop bundle
        env:
          REQUESTED_BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_BUNDLE_VERSION"
          if [ -z "$version" ]; then
            version="$(git describe --tags --always)"
          fi
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          CMUX_GHOSTTY_CHECKOUT="$GITHUB_WORKSPACE/ghostty-linux" \
          CMUX_LINUX_BUNDLE_GHOSTTY_REPOSITORY="manaflow-ai/ghostty" \
          CMUX_LINUX_BUNDLE_VERSION="$version" \
            ./linux/scripts/build-bundle.sh
          (cd dist && sha256sum -c "cmux-linux-$(uname -m).tar.gz.sha256")

      - name: Record source provenance
        env:
          REQUESTED_BUNDLE_VERSION: ${{ inputs.bundle_version }}
          GHOSTTY_REF: ${{ inputs.ghostty_ref }}
        run: |
          set -euo pipefail
          version="$REQUESTED_BUNDLE_VERSION"
          if [ -z "$version" ]; then
            version="$(git describe --tags --always)"
          fi
          archive="cmux-linux-$(uname -m).tar.gz"
          jq -n \
            --arg schema "cmux.linux-bundle.provenance.v1" \
            --arg version "$version" \
            --arg cmux_commit "$(git rev-parse HEAD)" \
            --argjson cmux_dirty false \
            --arg ghostty_repository "manaflow-ai/ghostty" \
            --arg ghostty_ref "$GHOSTTY_REF" \
            --arg ghostty_commit "$(git -C ghostty-linux rev-parse HEAD)" \
            --argjson ghostty_dirty false \
            --arg rust_version "$(rustc --version)" \
            --arg zig_version "$(zig version)" \
            --arg archive "$archive" \
            --arg archive_sha256 "$(sha256sum "dist/$archive" | awk '{print $1}')" \
            '{
              schema: $schema,
              version: $version,
              cmux_commit: $cmux_commit,
              cmux_dirty: $cmux_dirty,
              ghostty_repository: $ghostty_repository,
              ghostty_ref: $ghostty_ref,
              ghostty_commit: $ghostty_commit,
              ghostty_dirty: $ghostty_dirty,
              rust_version: $rust_version,
              zig_version: $zig_version,
              archive: $archive,
              archive_sha256: $archive_sha256
            }' > dist/cmux-linux-build.json

      - name: Upload Linux desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-linux-desktop-${{ github.run_id }}
          path: |
            dist/cmux-linux-*.tar.gz
            dist/cmux-linux-*.tar.gz.sha256
            dist/cmux-linux-build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
