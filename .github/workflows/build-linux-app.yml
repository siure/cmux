name: Build Linux Desktop App

on:
  workflow_dispatch:
    inputs:
      cmux_ref:
        description: Optional cmux commit to build instead of the dispatched ref
        required: false
        type: string
      bundle_version:
        description: Optional version written into the bundle metadata
        required: false
        type: string
  workflow_call:
    inputs:
      cmux_ref:
        description: Optional cmux commit to build instead of the caller commit
        required: false
        type: string
      bundle_version:
        description: Optional version written into the bundle metadata
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linux-desktop-app-${{ github.ref }}-${{ inputs.cmux_ref || github.sha }}
  cancel-in-progress: false

jobs:
  build-linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_VERSION: "1.92.0"
      ZIG_VERSION: "0.16.0"
      ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

    steps:
      - name: Checkout cmux
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.cmux_ref || github.sha }}
          fetch-depth: 0

      - name: Checkout pinned Linux Ghostty submodule
        id: ghostty
        run: |
          set -euo pipefail
          git submodule sync -- ghostty
          git submodule update --init --depth 1 ghostty
          ghostty_ref="$(git -C ghostty rev-parse HEAD)"
          pinned_ref="$(git ls-tree HEAD ghostty | awk '{print $3}')"
          ghostty_repository="$(git config -f .gitmodules --get submodule.ghostty.url)"
          test "$ghostty_ref" = "$pinned_ref"
          test -n "$ghostty_repository"
          echo "ref=$ghostty_ref" >> "$GITHUB_OUTPUT"
          echo "repository=$ghostty_repository" >> "$GITHUB_OUTPUT"

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc \
            g++ \
            libegl1-mesa-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            mesa-utils \
            pkg-config \
            xz-utils

      - name: Configure Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Install pinned Zig
        run: |
          archive="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          url="https://ziglang.org/download/${ZIG_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "/tmp/$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "/tmp/$archive" | sha256sum --check -
          sudo tar -xJf "/tmp/$archive" -C /opt
          sudo ln -sf "/opt/zig-x86_64-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version

      - name: Cache Rust and Zig build data
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            linux/target
            ~/.cache/zig
            ghostty/.zig-cache
          key: linux-desktop-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ env.ZIG_VERSION }}-${{ hashFiles('linux/Cargo.lock') }}-${{ steps.ghostty.outputs.ref }}

      - name: Build validated Linux desktop bundle
        env:
          GHOSTTY_REPOSITORY: ${{ steps.ghostty.outputs.repository }}
          REQUESTED_BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_BUNDLE_VERSION"
          if [ -z "$version" ]; then
            version="$(git describe --tags --always)"
          fi
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          CMUX_GHOSTTY_CHECKOUT="$GITHUB_WORKSPACE/ghostty" \
          CMUX_LINUX_BUNDLE_GHOSTTY_REPOSITORY="$GHOSTTY_REPOSITORY" \
          CMUX_LINUX_BUNDLE_VERSION="$version" \
            ./linux/scripts/build-bundle.sh
          (cd dist && sha256sum -c "cmux-linux-$(uname -m).tar.gz.sha256")

      - name: Record source provenance
        env:
          GHOSTTY_REPOSITORY: ${{ steps.ghostty.outputs.repository }}
          REQUESTED_BUNDLE_VERSION: ${{ inputs.bundle_version }}
          GHOSTTY_REF: ${{ steps.ghostty.outputs.ref }}
        run: |
          set -euo pipefail
          version="$REQUESTED_BUNDLE_VERSION"
          if [ -z "$version" ]; then
            version="$(git describe --tags --always)"
          fi
          archive="cmux-linux-$(uname -m).tar.gz"
          jq -n \
            --arg schema "cmux.linux-bundle.provenance.v1" \
            --arg version "$version" \
            --arg cmux_commit "$(git rev-parse HEAD)" \
            --argjson cmux_dirty false \
            --arg ghostty_repository "$GHOSTTY_REPOSITORY" \
            --arg ghostty_ref "$GHOSTTY_REF" \
            --arg ghostty_commit "$(git -C ghostty rev-parse HEAD)" \
            --argjson ghostty_dirty false \
            --arg rust_version "$(rustc --version)" \
            --arg zig_version "$(zig version)" \
            --arg archive "$archive" \
            --arg archive_sha256 "$(sha256sum "dist/$archive" | awk '{print $1}')" \
            '{
              schema: $schema,
              version: $version,
              cmux_commit: $cmux_commit,
              cmux_dirty: $cmux_dirty,
              ghostty_repository: $ghostty_repository,
              ghostty_ref: $ghostty_ref,
              ghostty_commit: $ghostty_commit,
              ghostty_dirty: $ghostty_dirty,
              rust_version: $rust_version,
              zig_version: $zig_version,
              archive: $archive,
              archive_sha256: $archive_sha256
            }' > dist/cmux-linux-build.json

      - name: Upload Linux desktop bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-linux-desktop-${{ github.run_id }}
          path: |
            dist/cmux-linux-*.tar.gz
            dist/cmux-linux-*.tar.gz.sha256
            dist/cmux-linux-build.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
